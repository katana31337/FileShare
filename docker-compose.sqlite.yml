# ============================================
# QuickShare — Docker Compose (SQLite)
# ============================================
# Architecture:
#   - frontend: Nginx serving React app + reverse proxy
#   - backend: Node.js Express API server
#
# Usage:
#   docker compose -f docker-compose.sqlite.yml up -d
#   docker compose -f docker-compose.sqlite.yml down

version: '3.8'

services:
  # Frontend - Nginx serving React app
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quickshare-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Backend - Node.js Express API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quickshare-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_TYPE=sqlite
      - DB_SQLITE_PATH=/app/data/quickshare.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://frontend}
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/data/uploads
      - ./certs:/app/certs:ro
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend_:
    driver: local
  backend_uploads:
    driver: local

networks:
  quickshare_net:
    driver: bridge
