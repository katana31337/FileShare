# ============================================
# QuickShare — Docker Compose (PostgreSQL default)
# ============================================
# Architecture:
#   - frontend: Nginx serving React app + reverse proxy
#   - backend: Node.js Express API server
#   - postgres: PostgreSQL database
#
# Usage:
#   docker compose up -d
#   docker compose down

version: '3.8'

services:
  # Frontend - Nginx serving React app
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quickshare-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Backend - Node.js Express API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quickshare-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_TYPE=postgres
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=quickshare
      - DB_USER=quickshare
      - DB_PASSWORD=${DB_PASSWORD:-quickshare_pass}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://frontend}
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
    volumes:
      - backend_uploads:/app/data/uploads
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Database - PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: quickshare-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=quickshare
      - POSTGRES_USER=quickshare
      - POSTGRES_PASSWORD=${DB_PASSWORD:-quickshare_pass}
    volumes:
      - postgres_/var/lib/postgresql/data
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickshare"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_
    driver: local
  backend_uploads:
    driver: local

networks:
  quickshare_net:
    driver: bridge
