# ============================================
# QuickShare — Docker Compose with MongoDB
# ============================================
# Architecture:
#   - frontend: Nginx serving React app + reverse proxy
#   - backend: Node.js Express API server
#   - mongo: MongoDB database
#
# Usage:
#   docker compose -f docker-compose.mongo.yml up -d
#   docker compose -f docker-compose.mongo.yml down

version: '3.8'

services:
  # Frontend - Nginx serving React app
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quickshare-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Backend - Node.js Express API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quickshare-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_TYPE=mongodb
      - DB_MONGO_URI=mongodb://mongo:27017/quickshare
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://frontend}
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
    volumes:
      - backend_uploads:/app/data/uploads
      - ./certs:/app/certs:ro
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Database - MongoDB
  mongo:
    image: mongo:7
    container_name: quickshare-db
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - quickshare_net
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  quickshare_net:
    driver: bridge
