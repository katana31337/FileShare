# ============================================
# QuickShare — Docker Compose with MySQL
# ============================================
# Architecture:
#   - frontend: Nginx serving React app + reverse proxy
#   - backend: Node.js Express API server
#   - mysql: MySQL database
#
# Usage:
#   docker compose -f docker-compose.mysql.yml up -d
#   docker compose -f docker-compose.mysql.yml down

version: '3.8'

services:
  # Frontend - Nginx serving React app
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quickshare-frontend
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Backend - Node.js Express API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quickshare-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_TYPE=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=quickshare
      - DB_USER=quickshare
      - DB_PASSWORD=${DB_PASSWORD:-quickshare_pass}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://frontend}
      - SSL_CERT=${SSL_CERT:-}
      - SSL_KEY=${SSL_KEY:-}
    volumes:
      - backend_uploads:/app/data/uploads
      - ./certs:/app/certs:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Database - MySQL
  mysql:
    image: mysql:8
    container_name: quickshare-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD:-rootpass}
      - MYSQL_DATABASE=quickshare
      - MYSQL_USER=quickshare
      - MYSQL_PASSWORD=${DB_PASSWORD:-quickshare_pass}
    volumes:
      - mysql_/var/lib/mysql
    networks:
      - quickshare_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_
    driver: local
  backend_uploads:
    driver: local

networks:
  quickshare_net:
    driver: bridge
